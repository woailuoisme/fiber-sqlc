apiVersion: v1
kind: Service
metadata:
  name: {{ include "cfiber.fullname" . }}
  labels:
    {{- include "cfiber.labels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cfiber.selectorLabels" (dict "context" . "component" "api") | nindent 4 }}
