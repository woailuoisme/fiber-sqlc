name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Governance & Build
    runs-on: ubuntu-24.04
    steps:
      # 1. 运行 Release Please：负责维护 Release PR，并在合并后自动打 Tag 和创建 GitHub Release
      - name: Run Release Please
        id: release-please
        if: github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: cfiber

      # 2. 判定当前运行是否需要触发编译与制品发布
      - name: Determine if release build is required
        id: check-release
        run: |
          if [ "${{ steps.release-please.outputs.release_created }}" = "true" ] || \
             [ "${{ steps.release-please.outputs.releases_created }}" = "true" ] || \
             [[ "${{ github.ref }}" == refs/tags/v* ]] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. 仅在确实需要构建时检出完整仓库（携带标签与完整历史）
      - name: Checkout repository
        if: steps.check-release.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 4. 初始化 Go 工具链环境
      - name: Set up Go
        if: steps.check-release.outputs.should_build == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3'
          cache: true

      # 5. 执行单元测试门禁
      - name: Run tests
        if: steps.check-release.outputs.should_build == 'true'
        run: go test ./...

      # 6. 调用 GoReleaser 编译全平台二进制并将产物挂载至 GitHub Release
      - name: Run GoReleaser
        if: steps.check-release.outputs.should_build == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ (steps.release-please.outputs.release_created == 'true' || steps.release-please.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v')) && 'release --clean' || 'release --clean --snapshot --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
